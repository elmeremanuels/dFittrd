# Runs Modal jobs from GitHub Actions. Cloud Claude sessions cannot reach Modal
# (gRPC is blocked by their network proxy); GitHub runners can.
# Trigger: change .github/modal/run.txt on a claude/* branch (or run manually).
# run.txt holds one command per line, run in order from the repo root, e.g.
#   modal run spikes/garment-engine/modal/smoke.py
# Needs repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET.
name: modal

on:
  push:
    branches: ['claude/**']
    paths: ['.github/modal/run.txt']
  workflow_dispatch:

concurrency:
  group: modal-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CURTAIN_MODAL_GPU: ${{ vars.CURTAIN_MODAL_GPU }}
      CURTAIN_MODAL_REGION: ${{ vars.CURTAIN_MODAL_REGION }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check Modal secrets
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Add repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: |
          pip install modal==1.6.3
          pnpm install --frozen-lockfile
      - name: Run commands from .github/modal/run.txt
        run: |
          mkdir -p modal-out
          status=0
          while IFS= read -r cmd || [ -n "$cmd" ]; do
            case "$cmd" in ''|'#'*) continue ;; esac
            echo "::group::$cmd"
            echo "\$ $cmd" >> modal-out/log.txt
            bash -c "$cmd" 2>&1 | tee -a modal-out/log.txt
            rc=${PIPESTATUS[0]}
            echo "exit $rc" >> modal-out/log.txt
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then status=$rc; break; fi
          done < .github/modal/run.txt
          cp -r spikes/garment-engine/out modal-out/spike-out 2>/dev/null || true
          exit $status
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-out-${{ github.run_number }}
          path: modal-out
          retention-days: 14
