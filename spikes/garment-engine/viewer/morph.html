<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Server drape morphs</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f5efe7; color: #1a1612; font: 14px/1.4 Inter, system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      #panel { position: fixed; left: 8px; top: 8px; right: 8px; max-width: 520px; background: rgba(245, 239, 231, 0.92); padding: 8px 10px; border-radius: 6px; }
      #panel h1 { font-size: 15px; margin: 0 0 4px; }
      .estimate { color: #ff5a3c; font-weight: 600; }
      table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
      td, th { padding: 1px 6px; text-align: right; }
      input { width: 64px; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="panel">
      <h1>Server drape, blended on the device <span class="estimate">(estimate)</span></h1>
      <div>Hip <input id="hip" type="number" value="100" step="0.5" /> cm (stays in this tab) · t = <span id="t"></span> · <span id="fps">fps …</span></div>
      <table id="girths"></table>
      <div id="status">loading …</div>
    </div>
    <script type="module" src="./src/morphMain.ts"></script>
  </body>
</html>
